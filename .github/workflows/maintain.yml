name: maintain

on:
  schedule:
    - cron: '30 3 * * *'    # nightly: age out alerts past the window
    - cron: '17 4 * * SUN'  # weekly: keepalive commit
  workflow_dispatch:

permissions:
  contents: write

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Age out stale alerts (Gate 3, nightly pass)
        run: node src/age.mjs

      # ~130 hand-curated links to crisis lines, drug-checking programs and
      # FDA labels. They rot silently: testri.org stopped resolving and
      # DanceSafe's chapter directory 404'd with nobody noticing. Not strict -
      # a dead link should raise a flag in the run summary, never block the
      # nightly maintenance that ages out stale alerts.
      - name: Check outbound links
        id: links
        continue-on-error: true
        run: node scripts/check-links.mjs | tee /tmp/links.txt

      - name: Report dead links
        if: always()
        run: |
          {
            echo "### Outbound link check"
            echo ""
            echo '```'
            tail -40 /tmp/links.txt 2>/dev/null || echo "no output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Which counties have started publishing overdose toxicology? The four
      # medical-examiner sources were found by hand; this repeats the catalog
      # sweep weekly and writes candidates for a person to read (nothing is
      # ingested). docs/ALERT-SOURCES.md step 7; scripts/discover-sources.mjs.
      # Weekly only: it is six catalog calls and up to forty aggregate queries
      # against county portals, which is polite once a week and rude nightly.
      - name: Discover new county datasets
        if: github.event.schedule == '17 4 * * SUN' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: node scripts/discover-sources.mjs | tee -a "$GITHUB_STEP_SUMMARY"

      # GitHub disables scheduled workflows in public repos after 60 days with
      # no repository activity. Hourly ingest commits normally cover this, but a
      # long quiet stretch produces no commits — so touch a marker weekly.
      - name: Keepalive marker
        run: |
          mkdir -p .github
          date -u +%FT%TZ > .github/last-activity

      - name: Commit
        run: |
          git config user.name  "supplysignal-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ archive/ .github/last-activity review/source-candidates.json
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "maintain: $(date -u +%FT%TZ)"
            git push
          fi

  # Deploy what was just pushed. Commits made with GITHUB_TOKEN do not fire
  # push events (GitHub's recursion guard), so this calls the deploy directly.
  # Skipped entirely until the PAGES_PROJECT variable is set - see
  # docs/HOSTING.md. `before` is the commit this run started from, so the
  # deploy's skip check diffs exactly what this run changed.
  deploy:
    needs: maintain
    if: ${{ vars.PAGES_PROJECT != '' }}
    uses: ./.github/workflows/pages.yml
    with:
      before: ${{ github.sha }}
    secrets: inherit
