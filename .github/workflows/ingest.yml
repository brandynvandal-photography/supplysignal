name: ingest

on:
  schedule:
    # Hourly at :07 — offset off the top of the hour, where Actions queues are
    # most congested. Scheduled runs are best-effort; 10–30 min drift is normal.
    # Every 3 hours, not hourly. Each ingest that finds a change commits, and
    # every commit is a Netlify build against the plan's allowance. Alert
    # sources publish on the order of days, not minutes - hourly polling was
    # paying for 24 builds a day to catch changes that arrive far more slowly.
    - cron: '7 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run pipeline
        env:
          # Optional. Without it, ambiguous items are parked in review/
          # instead of being escalated — the pipeline still runs free.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
          # Optional. Socrata throttles anonymous callers by IP, and an Actions
          # runner is a busy shared address — Cook and Santa Clara both timed
          # out on real runs. A token moves this application into its own
          # bucket. It identifies the app, never a reader, and never reaches
          # the browser. Absent, every request goes out exactly as before.
          # Free from any Socrata portal, e.g. datacatalog.cookcountyil.gov.
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: node src/ingest.mjs

      # Data that fails the suite never reaches a reader. The classifier that
      # once published "West Nile Virus" as a meth alert is exactly what this
      # catches - a bad ingest is worse than a stale one.
      - name: Test before publishing
        run: npm test

      - name: Commit results
        run: |
          git config user.name  "supplysignal-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # review/seen.json only - review/pending.json names real people
          # and is gitignored. See appendReview in src/store.mjs.
          git add data/ feeds/ review/seen.json
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "ingest: $(date -u +%FT%TZ)"
            # REBASE BEFORE PUSHING, AND RETRY.
            #
            # A run checks out main, works for ten to fifteen minutes, then
            # pushes. Anything landing on main in that window makes the push a
            # non-fast-forward and the job fails - and the whole ingest is
            # thrown away with it, including any finding it published. That
            # happened on 2026-08-25: the 18:52 run committed 231 files and
            # could not push because a site deploy landed mid-run, so alerts
            # sat unpublished until the next cron three hours later.
            #
            # Nothing here conflicts in practice: this job only ever touches
            # data/, feeds/ and review/seen.json, and nothing else writes them.
            # A rebase replays this commit onto whatever arrived and pushes.
            for attempt in 1 2 3; do
              if git push; then
                echo "pushed on attempt $attempt"
                exit 0
              fi
              echo "push rejected (attempt $attempt) - rebasing onto origin/main"
              git pull --rebase --autostash origin main || {
                echo "::error::rebase failed - a human needs to look at this"
                exit 1
              }
            done
            echo "::error::could not push after 3 attempts"
            exit 1
          fi
