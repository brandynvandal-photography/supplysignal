# Netlify configuration.
#
# Production host: https://nightlight.help
#
# The domain is also compiled into two places that leave the building, and they
# have to be kept in step or the app starts publishing dead links:
#   - src/ingest.mjs SITE_URL, which writes absolute <link> elements into every
#     per-county RSS feed. Set the SITE_URL repository variable in GitHub
#     Actions; the fallback in that file is production, not a placeholder.
#   - config/settings.json userAgent, so a health department administrator
#     seeing this crawler in their logs can look up who it is.
#
# The reason to be here rather than on GitHub Pages is headers. site/index.html
# carries a strict CSP in a <meta> tag, but two directives CANNOT be set that
# way - frame-ancestors and X-Frame-Options are ignored in meta and only work as
# real response headers. That gap is written into the comment at the top of
# site/index.html and it is closed here.
#
# The site is published from the REPO ROOT, not from site/. The app loads its
# data with relative paths like ../data/substances.json, so site/ and data/ have
# to stay siblings. Root index.html redirects into site/ and preserves any
# #/fips deep link.

[build]
  publish = "."
  # Nothing to build. Every dataset is committed, generated by the hourly
  # ingest workflow rather than at deploy time.
  command = ""

  # Skip the deploy when nothing a visitor can reach has changed.
  #
  # This repo pushes often: the ingest workflow runs hourly, maintain nightly,
  # refresh weekly, plus ordinary commits - and every push is a build against
  # the plan's allowance. Most of those DO need deploying, because data/ is
  # served. But a commit touching only tests, scripts, workflows, docs, the
  # review queue or the attic cannot change a single byte any reader receives,
  # and paying a build for it is waste.
  #
  # `ignore` skips the build when the command exits 0. So: diff the paths that
  # ARE served, and exit 0 when none of them moved.
  #
  # NOTE: publish = "." means the whole repo is uploaded. Skipping a build is
  # not the same as a path being private - see the 404 block below, which is
  # what actually keeps server-side files off the web.
  #
  # CACHED_COMMIT_REF is empty on a first build and on a cleared cache - build
  # in that case rather than risk skipping a real deploy.
  ignore = "if [ -z \"$CACHED_COMMIT_REF\" ]; then exit 1; fi; git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- data site feeds index.html manifest.webmanifest netlify.toml _headers _redirects"

# Fast path to the app. index.html at the root does this too, in HTML and JS,
# and it stays as the fallback for anyone who fetches the file directly.
# Fragments survive a 301 - the browser reattaches them - so #/47065 still lands.
[[redirects]]
  from = "/"
  to = "/site/"
  status = 301
  force = false

# Everything that is not the app, 404'd.
#
# publish = "." uploads the entire repository, which is what the app needs -
# site/ loads ../data/*.json, so the two have to stay siblings. The cost is
# that every other directory ships too, and they were reachable:
#
#   /review/pending.json  200  - UNREVIEWED classifier output. The first item
#                                named a real person and their drug test
#                                result. README.md promises no PII is ever
#                                stored or displayed; this was both.
#   /src/store.mjs        200  - ingest internals
#   /config/settings.json 200  - feed configuration
#   /package.json         200  - dependency inventory
#   /scripts/*.mjs        200  - build tooling
#
# force = true is required. Netlify serves a matching static file BEFORE
# consulting redirects unless the rule forces, and every one of these paths is
# a real file on disk.
#
# This is a denylist, which is weaker than an allowlist - a new top-level
# directory ships public by default. A true allowlist is not expressible here
# (a forced /* catch-all would swallow /site and /data too), so the rule is:
# ANY new top-level path must be added here unless it is meant to be public.
[[redirects]]
  from = "/review/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/src/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/config/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/test/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/archive/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/node_modules/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true

# The project's own documentation. Not secret, but it is not the product, and
# README.md names internal paths, feed ids and failure modes worth not
# advertising. Every reference to these in the codebase is a code comment, not
# a link, so nothing user-facing depends on them being reachable.
#
# Listed one by one rather than as "/*.md": Netlify's splat matches path
# segments, so that pattern did NOT match /README.md - verified live, it kept
# returning 200 while every other rule worked.
[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/PRIVACY.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/EVIDENCE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/DESIGN-BRIEF.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/OUTREACH.md"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    # The two the meta tag cannot deliver.
    X-Frame-Options = "DENY"
    Content-Security-Policy = "frame-ancestors 'none'"

    # Nothing about a reader should reach another origin, including which page
    # of a harm reduction site they came from.
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"

    # HSTS. A downgrade to http on a shared or hostile network would expose the
    # hostname of a drug-checking site in plaintext.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

    # geolocation is (self) ON PURPOSE and must stay that way - "Near me"
    # resolves coordinates to a county in the browser against bundled boundary
    # data, and locking it to () here would break that with no privacy gain,
    # since the coordinate never leaves the device either way. Everything else
    # this app never uses is denied outright, including the ad-targeting APIs.
    Permissions-Policy = "geolocation=(self), camera=(), microphone=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=(), midi=(), browsing-topics=(), interest-cohort=()"

# Unversioned filenames, so revalidate rather than trust age. A stale app.js
# after a deploy is not hypothetical - it is exactly what served the old name
# for a while after the Nightlight rename. ETags make this a cheap 304.
[[headers]]
  for = "/site/*"
  [headers.values]
    Cache-Control = "no-cache"

# Rebuilt hourly by the ingest workflow.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "no-cache"

# The per-county RSS files are generated for external readers and the app is
# forbidden from ever requesting one (see src/store.mjs and the note in
# views/alerts.js). Served, never cached.
[[headers]]
  for = "/feeds/*"
  [headers.values]
    Cache-Control = "no-store"
