# Netlify configuration.
#
# Production host: https://nightlight.help
#
# The domain is also compiled into two places that leave the building, and they
# have to be kept in step or the app starts publishing dead links:
#   - src/ingest.mjs SITE_URL, which writes absolute <link> elements into every
#     per-county RSS feed. Set the SITE_URL repository variable in GitHub
#     Actions; the fallback in that file is production, not a placeholder.
#   - config/settings.json userAgent, so a health department administrator
#     seeing this crawler in their logs can look up who it is.
#
# The reason to be here rather than on GitHub Pages is headers. site/index.html
# carries a strict CSP in a <meta> tag, but two directives CANNOT be set that
# way - frame-ancestors and X-Frame-Options are ignored in meta and only work as
# real response headers. That gap is written into the comment at the top of
# site/index.html and it is closed here.
#
# The site is published from the REPO ROOT, not from site/. The app loads its
# data with relative paths like ../data/substances.json, so site/ and data/ have
# to stay siblings.
#
# Since 2026-08-14 each section is a real path - /alerts, /test, /drugs - served
# by rewriting onto site/index.html. Only the SECTION is in the path; county and
# substance stay in the fragment, because a fragment is never transmitted and
# PRIVACY.md is a promise about exactly that. See the app-routes block below.

[build]
  # An ALLOWLIST, staged by the build. Only what scripts/build-site.mjs copies
  # into dist/ is uploaded at all.
  #
  # This used to be publish = "." — the whole repository — with a denylist of
  # forced-404 rules keeping server-side files off the web. That control did
  # not hold. Netlify matches redirect rules case-sensitively, and production
  # answered on 2026-08-14:
  #
  #     /src/ingest.mjs       404        /Src/ingest.mjs       200
  #     /config/settings.json 404        /Config/settings.json 200
  #     /review/seen.json     404        /Review/seen.json     200
  #     /src%2Fingest.mjs     200        (percent-encoded slash, too)
  #
  # One capital letter defeated the only access control on the deploy. And a
  # denylist ships every NEW top-level directory public by default, so the next
  # person to add one has to remember a rule nothing reminds them about.
  #
  # A file that is not in dist/ cannot be served however it is spelled, cased
  # or escaped, because it is not there. The 404 rules below stay as defence in
  # depth, not as the mechanism.
  publish = "dist"
  command = "node scripts/build-site.mjs"

  # Skip the deploy when nothing a visitor can reach has changed.
  #
  # This repo pushes often: the ingest workflow runs hourly, maintain nightly,
  # refresh weekly, plus ordinary commits - and every push is a build against
  # the plan's allowance. Most of those DO need deploying, because data/ is
  # served. But a commit touching only tests, scripts, workflows, docs, the
  # review queue or the attic cannot change a single byte any reader receives,
  # and paying a build for it is waste.
  #
  # `ignore` skips the build when the command exits 0. So: diff the paths that
  # ARE served, and exit 0 when none of them moved.
  #
  # NOTE: publish = "." means the whole repo is uploaded. Skipping a build is
  # not the same as a path being private - see the 404 block below, which is
  # what actually keeps server-side files off the web.
  #
  # CACHED_COMMIT_REF is empty on a first build and on a cleared cache - build
  # in that case rather than risk skipping a real deploy.
  # See scripts/deploy-needed.mjs. The old one-liner here diffed the served
  # paths and skipped when none moved - correct, but it almost never fired,
  # because every ingest run rewrites timestamps (index.json's "generated" and
  # 42 "t" fields, lastScan on each county) whether or not it found anything.
  # A run publishing zero alerts still produced a commit and still paid for a
  # full production deploy. That is what exhausted the build credits on
  # 2026-08-13 and froze the site on an 02:18 deploy for a day.
  #
  # The script does the same diff, then looks INSIDE the changed JSON and
  # skips only when the sole difference is a clock reading or scan bookkeeping
  # nothing renders. Every failure mode builds.
  # Still worth skipping a build when nothing a reader can reach has changed —
  # the staging step is cheap but a Netlify build is not free. deploy-needed
  # already compares only served paths.
  ignore = "node scripts/deploy-needed.mjs"

# The root IS the app, rewritten rather than redirected.
#
# It used to 301 to /site/, and index.html at the root did the same in HTML and
# JS. Both are now the long way round: the router canonicalises whatever URL it
# lands on, so serving the shell here lets / become /alerts in the address bar
# with no request and no history entry.
#
# NOT a 301 to /alerts, which looks equivalent and is not. A browser reattaches
# the fragment across a redirect, so /#/test would arrive as /alerts#/test -
# and that parses as the alerts tab with a sub-route of "test", which is a
# different page from the one the link asked for. Rewriting keeps the fragment
# where the router can read it whole.
#
# force = true because index.html is a real file at this path and would
# otherwise win. That file stays as the no-JavaScript fallback for anyone who
# fetches /index.html directly.
[[redirects]]
  from = "/"
  to = "/site/index.html"
  status = 200
  force = true

# WHY THERE IS NO REDIRECT FROM THE OLD /support/ TO /app-support/
#
# Because Netlify cannot express one. It normalises a trailing slash, so
# /support and /support/ are the same path to the redirect engine: a rule for
# either one catches both. Verified live, twice - first the app shell was
# served at /support/ where the App Store page belonged, then with the 301
# ordered above it the App Store page was served at /support where the app's
# Support TAB belonged. There is no ordering that gives both.
#
# So the tab takes /support and the App Store page is at /app-support/ only.
#
# THIS MEANS THE SUPPORT URL IN APP STORE CONNECT MUST BE UPDATED TO
# https://nightlight.help/app-support/ - there is no safety net behind it. An
# un-updated URL serves the app's Support tab, which is harm-reduction
# resources rather than help with the app, to a reviewer who asked for the
# latter.

# ---------------------------------------------------------------- app routes
#
# Each tab is a real path, rewritten (200, not a redirect) onto the one HTML
# file the app has always been. The reader sees /alerts; the server serves
# /site/index.html and the router reads the path.
#
# WHAT STAYS IN THE FRAGMENT, AND WHY THIS LIST IS EXPLICIT RATHER THAN /*:
#
# Only the SECTION is in the path. County and substance stay after the #,
# because a fragment is never transmitted - PRIVACY.md section 3 is a promise
# about exactly this, and section 1 calls an access log containing
# "IP -> 47065" a disaster. /alerts is in Netlify's log. /alerts#/47065 is not.
#
# A catch-all /* rewrite would have been shorter and would have swallowed
# /data/*, /privacy/, /app-support/ and the 404 rules below it. Naming the
# routes means a typo 404s instead of silently serving the app shell, and the
# list is the same one VIEWS is keyed by in site/js/app.js - test/publish
# checks they have not drifted apart.
# The quick-exit destination. Served from our own domain so the promise the X
# makes — clears the device, overwrites the back stack, leaves — holds all the
# way to the page the reader lands on, instead of ending at a third party that
# has no idea it is part of a safety feature. site/w/index.html carries the
# note on what that page may and may not say.
[[redirects]]
  from = "/w"
  to = "/site/w/index.html"
  status = 200

[[redirects]]
  from = "/alerts"
  to = "/site/index.html"
  status = 200
[[redirects]]
  from = "/test"
  to = "/site/index.html"
  status = 200
[[redirects]]
  from = "/drugs"
  to = "/site/index.html"
  status = 200
[[redirects]]
  from = "/learn"
  to = "/site/index.html"
  status = 200
[[redirects]]
  from = "/support"
  to = "/site/index.html"
  status = 200
  force = true
[[redirects]]
  from = "/sos"
  to = "/site/index.html"
  status = 200
[[redirects]]
  from = "/after"
  to = "/site/index.html"
  status = 200
[[redirects]]
  from = "/heat"
  to = "/site/index.html"
  status = 200
[[redirects]]
  from = "/emerging"
  to = "/site/index.html"
  status = 200
[[redirects]]
  from = "/policy"
  to = "/site/index.html"
  status = 200
[[redirects]]
  from = "/supervision"
  to = "/site/index.html"
  status = 200
[[redirects]]
  from = "/sex"
  to = "/site/index.html"
  status = 200
[[redirects]]
  from = "/stimulants"
  to = "/site/index.html"
  status = 200
[[redirects]]
  from = "/about"
  to = "/site/index.html"
  status = 200

# Everything that is not the app, 404'd.
#
# publish = "." uploads the entire repository, which is what the app needs -
# site/ loads ../data/*.json, so the two have to stay siblings. The cost is
# that every other directory ships too, and they were reachable:
#
#   /review/pending.json  200  - UNREVIEWED classifier output. The first item
#                                named a real person and their drug test
#                                result. README.md promises no PII is ever
#                                stored or displayed; this was both.
#   /src/store.mjs        200  - ingest internals
#   /config/settings.json 200  - feed configuration
#   /package.json         200  - dependency inventory
#   /scripts/*.mjs        200  - build tooling
#
# force = true is required. Netlify serves a matching static file BEFORE
# consulting redirects unless the rule forces, and every one of these paths is
# a real file on disk.
#
# This is a denylist, which is weaker than an allowlist - a new top-level
# directory ships public by default. A true allowlist is not expressible here
# (a forced /* catch-all would swallow /site and /data too), so the rule is:
# ANY new top-level path must be added here unless it is meant to be public.
[[redirects]]
  from = "/review/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/src/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/config/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/test/*"
  to = "/404.html"
  status = 404
  force = true

# Engineering notes. docs/ALERT-SOURCES.md is a survey of which public health
# datasets are worth ingesting and which are dead ends — useful to whoever
# maintains this, and not something to serve to a reader looking for help.
[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/archive/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/node_modules/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true

# The project's own documentation. Not secret, but it is not the product, and
# README.md names internal paths, feed ids and failure modes worth not
# advertising. Every reference to these in the codebase is a code comment, not
# a link, so nothing user-facing depends on them being reachable.
#
# Listed one by one rather than as "/*.md": Netlify's splat matches path
# segments, so that pattern did NOT match /README.md - verified live, it kept
# returning 200 while every other rule worked.
[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/PRIVACY.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/EVIDENCE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/DESIGN-BRIEF.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/OUTREACH.md"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    # The two the meta tag cannot deliver.
    X-Frame-Options = "DENY"
    Content-Security-Policy = "frame-ancestors 'none'"

    # Nothing about a reader should reach another origin, including which page
    # of a harm reduction site they came from.
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"

    # HSTS. A downgrade to http on a shared or hostile network would expose the
    # hostname of a drug-checking site in plaintext.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

    # geolocation is (self) ON PURPOSE and must stay that way - "Near me"
    # resolves coordinates to a county in the browser against bundled boundary
    # data, and locking it to () here would break that with no privacy gain,
    # since the coordinate never leaves the device either way. Everything else
    # this app never uses is denied outright, including the ad-targeting APIs.
    Permissions-Policy = "geolocation=(self), camera=(), microphone=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=(), midi=(), browsing-topics=(), interest-cohort=()"

# ------------------------------------------------------------- caching
#
# TWO REGIMES, AND THE PATTERNS NEVER OVERLAP. That last part is the design
# constraint: Netlify's documentation does not say which header wins when two
# rules match one path, so the rules below are written so that no path is
# matched by both a no-cache rule and an immutable one. There is no "/site/*"
# and no "/data/*" any more - each directory is enumerated.
#
# 1. IMMUTABLE: anything whose name is its contents. scripts/build-site.mjs
#    renames every file under site/js/ and site/css/, and every national data
#    bundle (placed under data/h/), by a hash of its bytes, and rewrites every
#    reference to match. A changed file is a new name, so a cached copy can
#    never be stale; the browser may keep it for a year and never ask again.
#    This is what lets a returning reader boot with one conditional request
#    (index.html) instead of one per file. The hashed data bundles live in
#    their own directory precisely so this rule cannot touch alerts.json.
#
# 2. NO-CACHE: the entry points and everything the ingest rewrites in place.
#    index.html names the current hashes, so it must be revalidated on every
#    load or a reader could be handed a shell whose files are gone. sw.js for
#    the same reason and because a stale worker is the bug test/sw.test.mjs
#    exists for. alerts.json and counties/ are rebuilt every few hours under
#    the same names. ETags make every one of these a cheap 304.
#
# The service worker is served from /site/ but the pages it controls are at
# the root now (/alerts, /test). A worker's scope defaults to its own directory,
# so without Service-Worker-Allowed it would silently control nothing and every
# returning reader would lose offline access.
[[headers]]
  for = "/site/sw.js"
  [headers.values]
    Service-Worker-Allowed = "/"
    Cache-Control = "no-cache"

[[headers]]
  for = "/site/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/site/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"

# Icons and the quick-exit page: fixed names, rarely change, revalidate.
[[headers]]
  for = "/site/img/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/site/w/*"
  [headers.values]
    Cache-Control = "no-cache"

# Content-hashed. Every file under these two directories carries its hash in
# its name - test/dist.test.mjs fails the build if one does not.
[[headers]]
  for = "/site/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/site/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/data/h/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Rebuilt every few hours by the ingest workflow, under fixed names.
[[headers]]
  for = "/data/alerts.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/data/index.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/data/counties/*"
  [headers.values]
    Cache-Control = "no-cache"

# The per-county RSS files are generated for external readers and the app is
# forbidden from ever requesting one (see src/store.mjs and the note in
# views/alerts.js). Served, never cached.
[[headers]]
  for = "/feeds/*"
  [headers.values]
    Cache-Control = "no-store"

# --- staging-only: injected by scripts/ship.mjs, never on main ---
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex"
