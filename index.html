<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nightlight</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<!-- This page IS served, at /. The redirect in netlify.toml is force = false,
     so a real file at that path wins and the redirect never fires - verified
     live, 200 and 601 bytes. It therefore needs its own CSP: site/index.html's
     meta does not reach here.

     The inline script is hashed rather than removed, because it does the one
     thing <meta refresh> cannot - carry a #/fips deep link across the hop.
     Those links are in RSS feeds and shared messages. If the script body
     changes by even a byte, update this hash or the redirect silently stops
     working for anyone with JavaScript enabled. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-0HMS1yxofqGxPxMVFqXWTiyBbNG2TQBlwqsG1+niUss='; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="0; url=./site/">
<link rel="canonical" href="./site/">
<script>
  // Preserve any #/fips[/days] deep link across the redirect.
  location.replace("./site/" + (location.hash || ""));
</script>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; margin: 4rem auto; max-width: 32rem; padding: 0 1rem; }
</style>
</head>
<body>
  <p>Redirecting to <a href="./site/">Nightlight</a>&hellip;</p>
</body>
</html>
