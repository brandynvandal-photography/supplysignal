<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<!-- Closed origin. This is load-bearing: it stops a future contributor from
     casually reintroducing a font CDN or analytics tag, because the browser
     will refuse the request rather than quietly leaking a reader's IP.
     (frame-ancestors and X-Frame-Options cannot be set from a meta tag - see
     PRIVACY.md for the header-based hardening to apply if the host allows it.) -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'none';
  script-src 'self';
  style-src 'self';
  img-src 'self' data:;
  connect-src 'self';
  font-src 'self';
  base-uri 'none';
  form-action 'none';
  manifest-src 'self';
  worker-src 'self'">
<meta name="referrer" content="no-referrer">

<!-- Just the name.
     The title is read by people who are not the reader: it sits in the browser
     tab, in the tab switcher, in history, in a shared screen, and in whatever
     the phone shows when it is handed to somebody. "Drug supply alerts and
     harm reduction" in any of those places outs the person holding it, and the
     threat is often in the same room.

     The home-screen title has been innocuous by design since launch (see
     apple-mobile-web-app-title below). This was the same decision left half
     made. There is no SEO cost to pay for it either - the page is noindex. -->
<title>Nightlight</title>
<meta name="description" content="Nightlight.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#faf6f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17150f" media="(prefers-color-scheme: dark)">

<!-- Absolute, all four of these. The document is served at /alerts, /test and
     the rest now, rewritten onto this one file, so a relative href would
     resolve against / and 404. -->
<link rel="manifest" href="/site/manifest.webmanifest">
<link rel="apple-touch-icon" href="/site/img/icon-180.png">
<!-- Installs to the home screen and runs chrome-free on both platforms, so the
     same build is the web app, the iOS app and the Android app.
     The home-screen title is the ONE place the name is read by someone who may
     not be the reader - it stays innocuous by design. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nightlight">
<link rel="stylesheet" href="/site/css/app.css">
<!-- THE MODULE GRAPH, ANNOUNCED UP FRONT. app.js is a module script at the
     foot of the body, and it imports five more modules that the browser cannot
     know about until app.js itself has arrived and been parsed - so a cold
     open paid a serial round trip for app.js, then another for these, then a
     third for the view. Preloading them here lets the preload scanner fetch
     them alongside the stylesheet, which turns two of those waves into one.

     THIS LIST IS app.js's STATIC IMPORTS, and test/preload.test.mjs fails if
     the two drift: a module preloaded but no longer imported is a wasted
     request on every boot, and an import not listed here is a wave that has
     quietly come back. Only the static imports - the views are loaded on
     demand by route and must not all be pulled on every open. -->
<link rel="modulepreload" href="/site/js/ui.js">
<link rel="modulepreload" href="/site/js/data.js">
<link rel="modulepreload" href="/site/js/i18n.js">
<link rel="modulepreload" href="/site/js/seen.js">
<link rel="modulepreload" href="/site/js/routes.js">
<!-- Favicon mirrors the header mark: halo + core in --l-glow. No animation and
     no halo alpha subtleties survive at 16px, so it is drawn flat. -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='none' stroke='%23b8720f' stroke-width='2' opacity='.4'/><circle cx='16' cy='16' r='8.5' fill='none' stroke='%23b8720f' stroke-width='2.4' opacity='.65'/><circle cx='16' cy='16' r='7' fill='%23b8720f' opacity='.25'/><circle cx='16' cy='16' r='4.5' fill='%23b8720f'/></svg>">
<!-- Blocking, and in the head on purpose. It decides whether the opening
     splash renders at all, and that decision has to be made before the body
     paints. See the file.

     ABSOLUTE, like the four links above, and for the same reason. It was
     written relative ("js/native-flag.js"), which resolves against the
     document's own URL - /alerts, /test - to /js/native-flag.js, a path that
     does not exist on the web. So every web boot paid a blocking round trip
     for a 404 in the head before a pixel of the body could paint; the app
     still worked only because the web never needs the flag. The packaged
     build, where it matters, rewrites /site/ to / (scripts/build-app.mjs) so
     this resolves to the bundled file there too. -->
<script src="/site/js/native-flag.js"></script>
</head>
<body>

<!-- THE OPENING. Markup rather than something JavaScript builds, so it is on
     screen at first paint instead of after the bundle parses — a splash that
     appears once the app is already up has missed its own point.

     Same mark as the header, on a faster cycle: one sonar ripple is visible in
     the time this is on screen, where the header's is a 7-second idle breath
     nobody watches. aria-hidden and inert: it is decoration, it must never take
     focus, and a screen reader should be reading the page underneath it.

     It is CAPPED, and that matters more here than on most apps. This one has an
     SOS tab and people open it in a hurry. app.js removes it as soon as the
     first view renders, and a failsafe removes it regardless if the bundle is
     slow — nothing about a bad network can leave somebody looking at a logo
     while they need the overdose steps. -->
<div class="boot" id="boot" aria-hidden="true">
  <svg class="boot__logo" viewBox="0 0 32 32" width="64" height="64">
    <circle class="boot__ring boot__ring--outer" cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="1.6"/>
    <circle class="boot__ring boot__ring--inner" cx="16" cy="16" r="8.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
    <circle class="boot__halo" cx="16" cy="16" r="7" fill="currentColor"/>
    <circle class="boot__core" cx="16" cy="16" r="4.2" fill="currentColor"/>
  </svg>
  <span class="boot__name">Nightlight</span>
</div>

<a class="skip" href="#main">Skip to content</a>

<header class="topbar">
  <!-- Early access notice. INSIDE the topbar on purpose: the bar is the sticky
       element, so a child rides with it and there is only one sticky box to
       reason about. Height is part of --bar-h - see the token. -->
  <!-- THE PART THAT SLIDES, and .nav is deliberately outside it.

       .nav is `position: fixed` on a phone. A transform on any ancestor makes
       that fixed element resolve against the ancestor instead of the viewport,
       which throws the bottom tab bar to the top of the screen - the failure the
       two comments at .topbar::before describe, and which shipped once.

       So the header is split: everything that moves lives in here, and the nav
       sits beside it as a direct child of the bar - as does Quick Exit, for a
       different reason given at the button. That lets the slide use a
       transform, which the compositor can run on its own thread, instead of
       animating `top` and forcing layout on every frame. -->
  <div class="topbar__slide">
    <div class="earlybar">
      <div class="wrap">
        <span id="early-note"></span>
        <a id="early-link" href="#"></a>
      </div>
    </div>
    <div class="wrap">
      <button class="brand" id="home" aria-label="Nightlight home">
        <svg class="brand__logo" aria-hidden="true" viewBox="0 0 32 32" width="24" height="24">
          <circle class="brand__ring brand__ring--outer" cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <circle class="brand__ring brand__ring--inner" cx="16" cy="16" r="8.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
          <!-- Halo before core, so the core sits inside the bloom. -->
          <circle class="brand__halo" cx="16" cy="16" r="7" fill="currentColor"/>
          <circle class="brand__core" cx="16" cy="16" r="4.2" fill="currentColor"/>
        </svg>
        <span class="brand__name">Nightlight</span>
      </button>

      <!-- On wide screens this sits in the header row; on phones the stylesheet
           pins it to the bottom of the viewport, within thumb reach. -->

      <span class="topbar__spacer"></span>

      <!-- Search lives in the header rather than the tab bar: the bar is already
           six wide at 375px and a seventh truncates them all. -->
      <button class="iconbtn" id="searchbtn" aria-label="Search" title="Search"
              aria-expanded="false" aria-controls="searchpanel">
        <!-- SVG rather than the ⌕ glyph, which renders thin and small at any
             font-size and differs wildly across platforms. This is the same
             approach as the brand mark and it scales cleanly. -->
        <!-- SVG rather than the ⌕ glyph, which renders thin and small at any
             font-size and differs wildly across platforms. This is the same
             approach as the brand mark and it scales cleanly.

             SIZE REVERTED 2026-08-14. It was enlarged twice - 22 to 24, then to
             27 with a heavier stroke - chasing a report that it looked small.
             It looks small on iPadOS and correct on the web, so the enlargement
             was fixing the wrong surface and made every desktop and phone
             browser wrong to help one. If iPadOS needs it, that is a rule keyed
             to iPadOS, not a bigger icon everywhere. -->
        <svg class="iconbtn__svg" aria-hidden="true" viewBox="0 0 24 24" width="22" height="22"
             fill="none" stroke="currentColor" stroke-width="2.1"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="10.5" cy="10.5" r="6.5"/>
          <path d="M15.4 15.4 L21 21"/>
        </svg>
      </button>

      <button class="iconbtn" id="theme" aria-label="Switch color theme" title="Switch color theme">
        <span aria-hidden="true">◐</span>
      </button>
    </div>
  </div>

  <!-- QUICK EXIT IS NOT IN THE SLIDE, and that is the whole reason it sits
       here rather than beside the theme button where it reads as belonging.

       The threat is often in the same room. One tap clears what this site
       stored, unregisters the service worker, overwrites the back stack and
       leaves. It cannot delete browser history — no API can — so the copy
       says "overwrites", not "removes".

       The header slides off the top on any scroll and comes back only at the
       top of the page (see watchBarShrink in app.js). While the X lived in the
       slide it left with it, so the one control that exists for the moment
       somebody walks in was a scroll-to-top away from anywhere below the first
       screen. As a direct child of the bar it stays: the stylesheet pins it as
       a fixed pill at the top-right on a phone and positions it into the row
       on a wide screen, the same way .nav is handled below. Before .nav so the
       tab order is unchanged: brand, search, theme, exit, then the tabs. -->
  <button class="iconbtn" id="exit" aria-label="Quick exit — leave this site now and clear local traces"
          title="Quick exit">
    <span aria-hidden="true">✕</span>
  </button>

  <!-- Outside .topbar__slide on purpose - see the comment above it. -->
  <nav class="nav" aria-label="Sections">
    <!-- LEARN FIRST, ALERTS SECOND TO LAST.
         Learn is what somebody can use on any night, in any county, before
         anything has gone wrong - and it is the tab that makes the rest of the
         app legible. Alerts stays in the bar because it is the app's home and
         has to be reachable from every other screen, but it is the tab that
         most often has nothing to say: most counties have nothing published,
         and leading with an empty answer is a poor first impression of an app
         whose other five tabs are full.

         Drugs before Test, unchanged and for the original reason: looking a
         substance up needs nothing but the phone, while Test needs strips or a
         reagent kit already bought and in hand.

         SOS stays last. It is the one tab that is found by position under
         pressure, and moving it would cost somebody seconds they do not
         have. -->
    <a href="/learn"      data-tab="learn"><span class="ico" aria-hidden="true">◇</span>Learn</a>
    <a href="/drugs"      data-tab="substances"><span class="ico" aria-hidden="true">◐</span>Drugs</a>
    <a href="/test"       data-tab="test"><span class="ico" aria-hidden="true">◈</span>Test</a>
    <a href="/support"    data-tab="support"><span class="ico" aria-hidden="true">❋</span>Support</a>
    <a href="/alerts"     data-tab="alerts"><span class="ico" aria-hidden="true">◉</span>Alerts</a>
    <a href="/sos"        data-tab="help" aria-label="Emergency"><span class="ico" aria-hidden="true">✚</span>SOS</a>
  </nav>
</header>

<!-- Collapsed until asked for. Outside #view so a search survives navigation
     and does not flicker on every route change. -->
<div id="searchpanel" class="searchpanel" hidden>
  <div class="wrap">
    <input id="searchinput" class="input" type="text" autocomplete="off" spellcheck="false"
           role="combobox" aria-expanded="false" aria-controls="searchresults"
           aria-label="Search Nightlight"
           placeholder="A drug, its street name, or a question">
    <div id="searchresults" class="searchresults" role="listbox" aria-label="Results"></div>
    <!-- A SIBLING of the listbox, not a child: clear(results) wipes children on
         every keystroke, so a status message living inside it could never be
         announced. Sighted users saw "Nothing matched"; screen reader users
         got silence. -->
    <p id="searchstatus" class="sec__note" role="status" aria-live="polite"></p>
  </div>
</div>

<main id="main" class="wrap" tabindex="-1">
  <!-- Filled once at boot and left alone. Outside #view, which the router
       clears on every navigation, so it does not flicker or re-pick. -->
  <div id="kindbar"></div>
  <!-- No aria-live here. It was announcing the whole document on every
     navigation - focusView() has already moved focus to the new h1, so
     the reader is told where they are twice, the second time by having
     the entire page read at them. aria-busy stays; the genuine live
     regions are the scoped role="status" nodes inside the views. -->
  <div id="view" aria-busy="true">
    <div class="skel" aria-hidden="true">
      <div class="skel__row"></div><div class="skel__row"></div><div class="skel__row"></div>
    </div>
  </div>
</main>

<footer class="foot">
  <div class="wrap">
    <p id="foot-early"></p>
    <p id="foot-privacy"></p>
    <p id="foot-disclaimer"></p>
    <p id="foot-crisis"></p>
    <p id="foot-meta"></p>
    <p class="foot__links"><a class="btn btn--ghost btn--sm" href="#/about">About this site</a></p>
  </div>
</footer>

<script type="module" src="/site/js/app.js"></script>
</body>
</html>
