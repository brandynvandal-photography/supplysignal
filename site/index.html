<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<!-- Closed origin. This is load-bearing: it stops a future contributor from
     casually reintroducing a font CDN or analytics tag, because the browser
     will refuse the request rather than quietly leaking a reader's IP.
     (frame-ancestors and X-Frame-Options cannot be set from a meta tag - see
     PRIVACY.md for the header-based hardening to apply if the host allows it.) -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'none';
  script-src 'self';
  style-src 'self';
  img-src 'self' data:;
  connect-src 'self';
  font-src 'self';
  base-uri 'none';
  form-action 'none';
  manifest-src 'self';
  worker-src 'self'">
<meta name="referrer" content="no-referrer">

<title>Supply Check — drug supply alerts and harm reduction</title>
<meta name="description" content="County-level drug supply alerts, drug-checking results, and how to test a supply. Harm reduction information, not medical advice.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#faf6f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17150f" media="(prefers-color-scheme: dark)">

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="img/icon-180.png">
<!-- Installs to the home screen and runs chrome-free on both platforms, so the
     same build is the web app, the iOS app and the Android app. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Supply Check">
<link rel="stylesheet" href="css/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='none' stroke='%232d6a5f' stroke-width='2'/><circle cx='16' cy='16' r='8.5' fill='none' stroke='%232d6a5f' stroke-width='2.4' opacity='.55'/><circle cx='16' cy='16' r='4.5' fill='%232d6a5f'/></svg>">
</head>
<body>

<a class="skip" href="#main">Skip to content</a>

<header class="topbar">
  <div class="wrap">
    <button class="brand" id="home" aria-label="Supply Check home">
      <svg class="brand__logo" aria-hidden="true" viewBox="0 0 32 32" width="24" height="24">
        <circle class="brand__ring brand__ring--outer" cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <circle class="brand__ring brand__ring--inner" cx="16" cy="16" r="8.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <circle class="brand__core" cx="16" cy="16" r="4.2" fill="currentColor"/>
      </svg>
      <span class="brand__name">Supply Check</span>
    </button>

    <!-- On wide screens this sits in the header row; on phones the stylesheet
         pins it to the bottom of the viewport, within thumb reach. -->
    <nav class="nav" aria-label="Sections">
      <a href="#/alerts"     data-tab="alerts"><span class="ico" aria-hidden="true">◉</span>Alerts</a>
      <a href="#/test"       data-tab="test"><span class="ico" aria-hidden="true">◈</span>Test</a>
      <a href="#/substances" data-tab="substances"><span class="ico" aria-hidden="true">◐</span>Substances</a>
      <a href="#/learn"      data-tab="learn"><span class="ico" aria-hidden="true">◇</span>Learn</a>
      <a href="#/support"    data-tab="support"><span class="ico" aria-hidden="true">❋</span>Support</a>
      <a href="#/help"       data-tab="help"><span class="ico" aria-hidden="true">✚</span>Emergency</a>
    </nav>

    <span class="topbar__spacer"></span>

    <button class="iconbtn" id="theme" aria-label="Switch color theme" title="Switch color theme">
      <span aria-hidden="true">◐</span>
    </button>

    <!-- The threat is often in the same room. One tap wipes local traces,
         drops this page out of the back button, and leaves. -->
    <button class="iconbtn" id="exit" aria-label="Quick exit — leave this site now and clear local traces"
            title="Quick exit">
      <span aria-hidden="true">✕</span>
    </button>
  </div>
</header>

<main id="main" class="wrap" tabindex="-1">
  <!-- Filled once at boot and left alone. Outside #view, which the router
       clears on every navigation, so it does not flicker or re-pick. -->
  <div id="kindbar"></div>
  <div id="view" aria-live="polite" aria-busy="true">
    <div class="skel" aria-hidden="true">
      <div class="skel__row"></div><div class="skel__row"></div><div class="skel__row"></div>
    </div>
  </div>
</main>

<footer class="foot">
  <div class="wrap">
    <p id="foot-disclaimer"></p>
    <p id="foot-crisis"></p>
    <p id="foot-meta"></p>
    <p class="foot__links"><a href="#/about">About this site</a></p>
  </div>
</footer>

<script type="module" src="js/app.js"></script>
</body>
</html>
